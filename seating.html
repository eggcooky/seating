      const APP_VERSION = '2.32';
      const SIMPLE_OBF_KEY = 'ClassroomSeatingManager::simple-enc';
      function base64ToBytes(b64) {
        const bin = atob(b64);
        const out = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
        return out;
      }
      function simpleXorBytes(bytes) {
        const keyBytes = new TextEncoder().encode(SIMPLE_OBF_KEY);
        const out = new Uint8Array(bytes.length);
        for (let i = 0; i < bytes.length; i++) {
          out[i] = bytes[i] ^ keyBytes[i % keyBytes.length];
        }
        return out;

      const pkgEl = document.getElementById('obfuscatedAppPackage');

      const envelope = JSON.parse(pkgEl.textContent);
      const decodedJson = new TextDecoder().decode(simpleXorBytes(base64ToBytes(envelope.data)));
