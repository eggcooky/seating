        document.body.appendChild(sc);
      }
    } catch (err) {
      document.body.innerHTML = '<div style="padding:24px;font-family:sans-serif;color:#e11d48;font-weight:bold;">프로그램 로드 중 오류가 발생했습니다: ' + (err && err.message ? err.message : err) + '</div>';
    }
  })();
  </script>
</body>
