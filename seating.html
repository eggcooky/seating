  <script>
    (function() {
      // 업데이트 무결성 검증기가 파일 외부에서 버전을 확인할 수 있도록 버전 상수를 명시한다.
      const APP_VERSION = '2.23';
      const SIMPLE_ENC_KEY = 'ClassroomSeatingManager::simple-enc';
      function base64ToBytes(b64) {
        const bin = atob(b64);
        const out = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
        return out;
      }
      function simpleXorBytes(bytes) {
        const keyBytes = new TextEncoder().encode(SIMPLE_ENC_KEY);
        const out = new Uint8Array(bytes.length);
        for (let i = 0; i < bytes.length; i++) {
          out[i] = bytes[i] ^ keyBytes[i % keyBytes.length];
        }
        return out;
      }
      const pkgEl = document.getElementById('encryptedAppPackage');
      if (!pkgEl || !APP_VERSION) return;
      const envelope = JSON.parse(pkgEl.textContent);
      const decryptedJson = new TextDecoder().decode(simpleXorBytes(base64ToBytes(envelope.data)));
      const bundle = JSON.parse(decryptedJson);

      const styleEl = document.createElement('style');
      styleEl.textContent = bundle.style;
      document.head.appendChild(styleEl);

      document.body.className = bundle.bodyClass;
      document.body.innerHTML = bundle.bodyHtml;

      const scriptEl = document.createElement('script');
      scriptEl.textContent = bundle.script;
      document.body.appendChild(scriptEl);
    })();
